name: FixNear checks

on:
  push:
    paths:
      - 'fixnear/**'
      - '.github/workflows/fixnear-ci.yml'
  pull_request:
    paths:
      - 'fixnear/**'
      - '.github/workflows/fixnear-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixnear
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Catalog and price evidence
        run: |
          python scripts/validate_catalog.py
          python scripts/validate_price_evidence.py
          python scripts/validate_brand_logos.py
      - name: User and admin flows
        run: python scripts/test_user_flows.py
